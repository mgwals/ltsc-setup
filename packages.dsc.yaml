# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
#
# Win11 GameBoost package baseline.
# This file is intentionally package-only. OS tweaks, backup and restore live in
# GameBoost.ps1 because they need detection, reporting and rollback.
properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Xbox App for Game Pass access
        allowPrerelease: false
      settings:
        id: 9MV0B5HZVK9Z
        source: msstore
        Ensure: Present

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Steam
        allowPrerelease: false
      settings:
        id: Valve.Steam
        source: winget
        Ensure: Present

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Discord
        allowPrerelease: false
      settings:
        id: Discord.Discord
        source: winget
        Ensure: Present

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install 7-Zip
        allowPrerelease: false
      settings:
        id: 7zip.7zip
        source: winget
        Ensure: Present

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Mozilla Firefox
        allowPrerelease: false
      settings:
        id: Mozilla.Firefox
        source: winget
        Ensure: Present

  configurationModules:
    - name: Microsoft.WinGet.DSC
      version: 1.0.0
