name: Lint & Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $warnings = Get-ChildItem -Path . -Filter *.ps1 -Recurse |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning }
          if ($warnings) {
            Write-Host "::warning::PSScriptAnalyzer warnings (non-blocking):"
            $warnings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
          }

          $errors = Get-ChildItem -Path . -Filter *.ps1 -Recurse |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error }
          if ($errors) {
            $errors | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($errors.Count) error(s)."
          }
          Write-Host "All PowerShell scripts passed linting."

  release:
    name: Build Release
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build release zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "ApexPulse11-$tag.zip"
          $files = @(
            "ApexPulse.ps1",
            "GameBoost.ps1",
            "setup.ps1",
            "packages.dsc.yaml",
            "LICENSE",
            "README.md"
          )
          Compress-Archive -Path $files -DestinationPath $zipName -Force
          Write-Host "Created $zipName"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ApexPulse11-*.zip
          generate_release_notes: true
